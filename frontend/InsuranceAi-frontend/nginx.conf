# Serves the built React SPA and reverse-proxies /api to the backend container by its
# docker-compose service name -- mirrors what vite.config.js's dev-server proxy does locally, so
# the frontend's own code (always calling relative /api/... paths) needs no changes between dev
# and prod.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: any path that isn't a real static file falls back to index.html
    # so React Router can handle it, instead of nginx returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed filenames (Vite's default build output) can be cached aggressively; index.html
    # itself must not be, or a redeploy won't be picked up by returning visitors.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
