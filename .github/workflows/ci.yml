name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let an in-progress main release finish; only obsolete PR checks are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  PUBLIC_SITE_URL: https://insurance.gkbuilds.in

jobs:
  backend-build-test:
    name: Backend - build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run backend tests
        run: mvn -B clean test
      - name: Build application
        run: mvn -B package -DskipTests

  frontend-build:
    name: Frontend - validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/InsuranceAi-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/InsuranceAi-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - name: Build production frontend
        env:
          VITE_SITE_URL: ${{ env.PUBLIC_SITE_URL }}
        run: npm run build

  deployment-config:
    name: Validate source-free deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      POSTGRES_PASSWORD: ci-validation-only-not-a-secret
      JWT_SECRET: ci-validation-only-not-a-secret-that-is-long-enough-for-config
      APP_BOOTSTRAP_ADMIN_PASSWORD: ci-validation-only-admin-password
      OPENAI_API_KEY: ci-validation-only-not-a-real-key
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n deploy/update.sh
      - name: Exercise update failures without a Docker daemon
        run: python3 deploy/test_update.py
      - name: Validate Compose interpolation without starting containers
        run: docker compose --env-file .env.prod.example -p insurance -f docker-compose.prod.yml config --quiet

  docker-build-push:
    name: Build and publish images
    needs: [backend-build-test, frontend-build, deployment-config]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image names
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          repo_lower="${REPOSITORY,,}"
          echo "backend=ghcr.io/${repo_lower}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${repo_lower}-frontend" >> "$GITHUB_OUTPUT"
      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.backend }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/InsuranceAi-frontend
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.frontend }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: VITE_SITE_URL=${{ env.PUBLIC_SITE_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Update convenience latest tags after both images succeed
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          BACKEND_IMAGE: ${{ steps.image.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.image.outputs.frontend }}
        run: |
          docker buildx imagetools create --tag "${BACKEND_IMAGE}:latest" "${BACKEND_IMAGE}:${GITHUB_SHA}"
          docker buildx imagetools create --tag "${FRONTEND_IMAGE}:latest" "${FRONTEND_IMAGE}:${GITHUB_SHA}"
      - name: Prepare source-free server bundle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p server-bundle/nginx
          cp docker-compose.prod.yml server-bundle/
          cp deploy/update.sh deploy/README.md server-bundle/
          cp .env.prod.example server-bundle/
          cp deploy/nginx/insurance.gkbuilds.in.conf server-bundle/nginx/
          printf '%s\n' "$GITHUB_SHA" > server-bundle/release-tag.txt
      - name: Upload server bundle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: insurance-server-${{ github.sha }}
          path: server-bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to AlmaLinux VPS
    needs: [docker-build-push]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://insurance.gkbuilds.in
    concurrency:
      group: insurance-vps-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH with verified host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY" && test -n "$VPS_KNOWN_HOSTS"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] && (( VPS_PORT >= 1 && VPS_PORT <= 65535 ))
          install -m 700 -d "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/insurance_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Upload only runtime configuration and deploy exact commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          options=(-i "$HOME/.ssh/insurance_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          target="${VPS_USER}@${VPS_HOST}"
          ssh "${options[@]}" -p "$VPS_PORT" "$target" 'test -d /opt/insurance && test -f /opt/insurance/.env'
          # Atomic replacement inside this application directory. Never copy .env or the Nginx vhost.
          scp "${options[@]}" -P "$VPS_PORT" docker-compose.prod.yml "${target}:/opt/insurance/docker-compose.prod.yml.next"
          scp "${options[@]}" -P "$VPS_PORT" deploy/update.sh "${target}:/opt/insurance/update.sh.next"
          ssh "${options[@]}" -p "$VPS_PORT" "$target" "cd /opt/insurance && exec 9>.insurance-update.lock && flock -n 9 && mv docker-compose.prod.yml.next docker-compose.prod.yml && mv update.sh.next update.sh && chmod 700 update.sh && INSURANCE_UPDATE_LOCKED=1 bash update.sh '${GITHUB_SHA}'"
      - name: Remove temporary SSH private key
        if: always()
        run: rm -f "$HOME/.ssh/insurance_deploy"
