services:
  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/insurance_ai
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TZ: Asia/Kolkata
    volumes:
      # RAG source PDFs -- drop files here on the host, then POST /api/ai/rag/ingest.
      - ./documents:/app/documents

  postgres:
    # pgvector/pgvector is the plain postgres:16 image with the pgvector extension precompiled
    # in -- same data directory format, so this is a drop-in swap. Needed for the RAG pipeline's
    # VectorStore (see V4__init_vector_store.sql).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: insurance_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insurance_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
