# Production profile overrides. Activated with SPRING_PROFILES_ACTIVE=prod (see
# docker-compose.prod.yml). Everything not overridden here keeps its application.yml value
# (Flyway-managed schema, ddl-auto=validate, MCP/RAG config, etc. are unchanged in prod).
#
# The one rule every override below follows: every secret is required with NO fallback default.
# application.yml's dev conveniences (a literal "admin" DB password, a JWT secret checked into
# git) must NOT be reachable in prod even by omission -- a deployment that forgets to set one of
# these environment variables should fail to start, not silently run insecurely.

server:
  port: ${PORT:8082}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

app:
  jwt:
    secret: ${JWT_SECRET}
    # Shorter-lived than the dev default (24h) -- a leaked production token stays valid for less
    # time. Still overridable if a longer session is genuinely needed.
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    # No default -- an empty/missing value here would silently allow no browser origins at all
    # rather than accidentally leaving the local dev origins open in production.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    com.insuranceai.backend: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: WARN
