# Add as a NEW vhost; retain your existing api.gkbuilds.in configuration.
# This assumes Nginx runs on the AlmaLinux host, outside Docker.
# Issue/verify a certificate covering insurance.gkbuilds.in before enabling 443.
# Adjust certificate paths if your existing certificate manager uses another location.
server {
    listen 80;
    server_name insurance.gkbuilds.in;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://insurance.gkbuilds.in$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name insurance.gkbuilds.in;

    ssl_certificate /etc/letsencrypt/live/insurance.gkbuilds.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insurance.gkbuilds.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
